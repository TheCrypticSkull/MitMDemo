# Runs the same image twice: once over plaintext HTTP, once over HTTPS.
# Point your "victim" laptop at each and compare what Wireshark can read.
#
# Before `docker compose up`, create the self-signed cert the HTTPS service needs:
#   mkdir -p certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout certs/key.pem -out certs/cert.pem \
#     -days 365 -subj "/CN=demo-bank.local"

services:
  bank-http:
    build: .
    image: northwind-demo-bank
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"      # browse to http://<docker-host-ip>:8080

  bank-https:
    build: .
    image: northwind-demo-bank
    environment:
      PORT: "8443"
      CERT_FILE: "/certs/cert.pem"
      KEY_FILE: "/certs/key.pem"
    volumes:
      - ./certs:/certs:ro
    ports:
      - "8443:8443"      # browse to https://<docker-host-ip>:8443
